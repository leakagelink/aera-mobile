<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arah Admin</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <div id="login" class="login">
      <form id="login-form" class="card login-card">
        <p class="brand">Arah Admin</p>
        <h1>Sign in</h1>
        <label>Email <input name="email" type="email" autocomplete="username" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required minlength="8" /></label>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </div>
    <div id="app" class="shell hidden">
      <aside>
        <p class="brand">Arah Admin</p>
        <nav>
          <button type="button" data-view="dashboard" class="active">Dashboard</button>
          <button type="button" data-view="providers">Providers</button>
          <button type="button" data-view="health">System Health</button>
          <button type="button" data-view="audit">Audit Logs</button>
          <button type="button" data-view="settings">Settings</button>
        </nav>
        <button id="logout" type="button" class="ghost">Sign out</button>
      </aside>
      <main id="main"></main>
    </div>
    <script src="/admin/admin.js"></script>
  </body>
</html>
